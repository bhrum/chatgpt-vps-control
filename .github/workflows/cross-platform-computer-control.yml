name: cross-platform-computer-control

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev

  macos-native-helper:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile and probe macOS native helper
        run: bash scripts/macos-app-smoke.sh
      - name: Upload macOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-computer-control-macos
          path: ${{ runner.temp }}/ChatGPT Computer Control.app
          if-no-files-found: error
          retention-days: 3

  windows-native-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Parse and exercise Windows UI Automation helper
        shell: powershell
        run: |
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile('native/windows/computer-helper.ps1',[ref]$null,[ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File scripts/windows-uia-smoke.ps1

  linux-managed-semantic-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install X11, AT-SPI, and GTK test dependencies
        shell: bash
        run: |
          set -euo pipefail
          packages=(xdotool wmctrl ffmpeg x11-utils x11-xserver-utils xvfb x11vnc xfwm4 dbus-x11 at-spi2-core python3-pyatspi gir1.2-atspi-2.0 libglib2.0-bin python3-gi gir1.2-gtk-3.0)
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_opts[@]}" update

          # GitHub's Ubuntu image ships aria2. Ask apt for the exact official
          # package URIs, fetch them concurrently into apt's cache, then let
          # apt perform the normal verified install from that cache.
          apt-get "${apt_opts[@]}" --print-uris --yes --no-install-recommends install "${packages[@]}" \
            | python3 -c 'import pathlib,re,sys; mirrors=[x.strip().split()[0].rstrip("/") for x in pathlib.Path("/etc/apt/apt-mirrors.txt").read_text().splitlines() if x.strip().startswith(("http://","https://"))]; prefix="mirror+file:/etc/apt/apt-mirrors.txt/"; [(print((mirrors[0]+"/"+m.group(1)[len(prefix):]) if m.group(1).startswith(prefix) and mirrors else m.group(1)), print("  out="+m.group(2))) for line in sys.stdin if (m:=re.match(r"^\x27([^\x27]+)\x27\s+(\S+)",line))]' \
            > "$RUNNER_TEMP/apt-aria2.txt"
          if [[ -s "$RUNNER_TEMP/apt-aria2.txt" ]] && command -v aria2c >/dev/null; then
            sudo aria2c --input-file="$RUNNER_TEMP/apt-aria2.txt" --dir=/var/cache/apt/archives \
              --max-concurrent-downloads=8 --max-connection-per-server=2 --split=2 --min-split-size=1M \
              --max-tries=3 --timeout=30 --continue=true --allow-overwrite=true --auto-file-renaming=false --summary-interval=0 || true
          fi
          sudo env DEBIAN_FRONTEND=noninteractive apt-get "${apt_opts[@]}" install -y --no-install-recommends "${packages[@]}"
          google-chrome --version
      - name: Configure managed headless desktop
        shell: bash
        run: |
          env -u DISPLAY -u DBUS_SESSION_BUS_ADDRESS CHATGPT_COMPUTER_HOME="$RUNNER_TEMP/computer-control" node bin/chatgpt-computer-control.js setup --no-deps --port 18995
          grep '^COMPUTER_MANAGED_X11=1$' "$RUNNER_TEMP/computer-control/.env"
          grep '^NO_AT_BRIDGE=0$' "$RUNNER_TEMP/computer-control/.env"
      - name: Start MCP and exercise coordinate plus semantic control
        shell: bash
        run: |
          env -u DISPLAY -u DBUS_SESSION_BUS_ADDRESS CHATGPT_COMPUTER_HOME="$RUNNER_TEMP/computer-control" COMPUTER_CDP_ENDPOINTS=http://127.0.0.1:9222 node bin/chatgpt-computer-control.js serve >"$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          for i in $(seq 1 120); do curl -fsS http://127.0.0.1:18995/health >/dev/null && break; sleep 0.1; done
          TOKEN=$(awk -F= '$1=="VPS_APP_TOKEN"{print $2}' "$RUNNER_TEMP/computer-control/.env")
          MCP_SMOKE_TOKEN="$TOKEN" MCP_SMOKE_PORT=18995 node scripts/mcp-smoke.mjs
          MCP_SMOKE_TOKEN="$TOKEN" MCP_SMOKE_PORT=18995 MCP_SMOKE_CDP_ENDPOINT=http://127.0.0.1:9222 MCP_SMOKE_LAUNCH_CHROME=1 MCP_SMOKE_ATSPI=1 MCP_SMOKE_BROWSER_SESSION=1 node scripts/semantic-mcp-smoke.mjs
      - if: always()
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/server.log" && cat "$RUNNER_TEMP/server.log" || true
          test -f "$RUNNER_TEMP/server.pid" && kill "$(cat "$RUNNER_TEMP/server.pid")" 2>/dev/null || true
